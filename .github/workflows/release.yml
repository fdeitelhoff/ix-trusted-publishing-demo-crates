name: Publish crate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Test and inspect package without publishing permission
        run: |
          cargo test --locked
          cargo publish --locked --dry-run

  publish:
    needs: check
    # Start this workflow on main, after a reviewed version bump.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Get short-lived publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
